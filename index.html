      .pixel-font { font-family: 'DotGothic16', 'Courier New', Courier, monospace; }
      .pixel-rendering-img {
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }
      .animate-pixel-idle { animation: pixel-bounce 0.8s steps(2, end) infinite; }
      @keyframes pixel-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes float-up {
        0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
      }
      .crt::before {
        content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));

      .scrollbar-hide::-webkit-scrollbar { display: none; }

      .scanline { width: 100%; height: 10px; background: rgba(255,255,255,0.1); position: absolute; z-index: 40; animation: scanline 6s linear infinite; pointer-events: none; }
      body { margin: 0; overflow: hidden; background-color: #171717; }
    </style>

          { id: 8, name: '学习委员', class: '黑魔法师', role: '知识输出者', avatar: 'https://s1.img-e.com/20260410/69d8c58e20e2a.png', quote: '知识的火球正在凝聚！遇到不懂的题随时找我。' },

          { id: 17, name: '联络大使', class: '舞者', role: '灵动连结者', avatar: 'https://s1.img-e.com/20260410/69d8c5b84f789.png', quote: '跟我一起舞动人脉，把所有资源串联起来吧！' },
          { id: 18, name: '场地总控', class: '绝枪战士', role: '阵地防卫者', avatar: 'https://s1.img-e.com/20260410/69d8c5b91c954.png', quote: '场地布置和设备调试交给我，防线绝对稳固。' },
          { id: 19, name: '破冰组长', class: '钐镰客', role: '僵局收割者', avatar: 'https://s1.img-e.com/20260410/69d8c5c095447.png', quote: '气氛太冷了？让我来收割这份尴尬！' },
          { id: 20, name: '学习互助', class: '贤者', role: '护盾提供者', avatar: 'https://s1.img-e.com/20260410/69d8c5c3f2649.png', quote: '提前为你加上防挂科护盾，期末复习稳了！' },
          { id: 21, name: '财务管理', class: '黑暗防卫者', role: '资源守卫者', avatar: 'https://s1.img-e.com/20260410/69d8c5c94923a.png', quote: '班费的每一笔流向，都在我的绝对防御之下。' },
          { id: 22, name: '技术支持', class: '赛博剑士', role: '赛博极客', avatar: 'https://s1.img-e.com/20260410/69d8c5d02a7e6.png', quote: 'PPT、视频剪辑、代码Bug？分分钟搞定。' },
          { id: 23, name: '外联干事', class: '游侠', role: '探索开拓者', avatar: 'https://s1.img-e.com/20260410/69d8c5d5d9a7c.png', quote: '世界很大，让我们去校外拉点赞助回来！' },
          { id: 24, name: '记录统筹', class: '风水士', role: '元素调和者', avatar: 'https://s1.img-e.com/20260410/69d8c5db1eda6.png', quote: '我将记录下我们所有的足迹，汇编成这本史诗手账。' },
        ];

        const PAGES = [
          { id: 'TITLE', title: '标题画面', type: 'static' },
          { id: 'DIRECTORY', title: '目录', type: 'static' },
          { id: 'ROSTER', title: '卷一：团队档案', type: 'static' },
          { id: 'COMMUNICATION', title: '卷二：沟通时刻', type: 'dynamic', category: '沟通时刻', desc: '记录小队解决分歧、达成共识的对话。' },
          { id: 'COLLABORATION', title: '卷三：协作高光', type: 'dynamic', category: '协作高光', desc: '分享团队配合、打出完美Combo的经历。' },
          { id: 'DECISION', title: '卷四：决策智慧', type: 'dynamic', category: '决策智慧', desc: '面对两难时，你是如何拍板抉择的？' },
          { id: 'INTERACTION', title: '卷五：互动感悟', type: 'dynamic', category: '互动感悟', desc: '同伴之间互相治愈、提供情绪价值的瞬间。' },
          { id: 'SKILLS', title: '卷六：技能分享', type: 'dynamic', category: '技能分享', desc: '点亮了哪些新技能？给队友加上Buff！' },
          { id: 'APPENDIX', title: '附录：通关须知', type: 'static' }
        ];

        const CharacterImage = ({ member, size = 48, isIdle = true, direction = 'right' }) => (
          <div className={`relative flex items-center justify-center ${isIdle ? 'animate-pixel-idle' : ''}`}
                style={{ width: size, height: size, transform: direction === 'left' ? 'scaleX(-1)' : 'none' }}>
            <img src={member.avatar} alt={member.class} className="pixel-rendering-img w-full h-full object-contain"
                 onError={(e) => {
                   e.target.onerror = null; e.target.style.backgroundColor = '#334155'; e.target.style.padding = '8px'; e.target.style.borderRadius = '4px';
                   e.target.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50" y="50" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="12">待导图</text></svg>';
                 }} />
          </div>
        );

        const RPGDialogueBox = ({ name, roleClass, text, onClose }) => {
          const [displayedText, setDisplayedText] = useState('');
          const [isFinished, setIsFinished] = useState(false);
          useEffect(() => {
            setDisplayedText(''); setIsFinished(false); let i = 0;
            const typingInterval = setInterval(() => {
              if (i < text.length) { setDisplayedText(prev => prev + text.charAt(i)); i++; }
              else { clearInterval(typingInterval); setIsFinished(true); }
            }, 50);
            return () => clearInterval(typingInterval);
          }, [text]);
          return (
            <div className="absolute bottom-4 left-4 right-4 md:bottom-8 md:left-8 md:right-8 z-50 animate-in slide-in-from-bottom-4">
              <div className="rpg-border bg-black/90 p-4 md:p-6 relative shadow-[0_10px_30px_rgba(0,0,0,0.8)]">
                <div className="absolute -top-4 left-4 bg-blue-900 border-2 border-white px-3 py-1 text-yellow-300 pixel-font text-sm font-bold shadow-md">
                  {name} [{roleClass}]
                </div>
                <p className="text-white pixel-font text-lg md:text-xl leading-relaxed mt-2 min-h-[60px]">
                  {displayedText}{!isFinished && <span className="inline-block w-3 h-5 bg-white ml-1 animate-pulse align-middle"></span>}
                </p>
                {isFinished && <div className="absolute bottom-4 right-4 text-yellow-400 animate-bounce cursor-pointer" onClick={onClose}>▼ 点击继续</div>}
              </div>
            </div>
          );
        };

        const App = () => {
          const [user, setUser] = useState(null);
          const [entries, setEntries] = useState([]);
          const [currentPageIndex, setCurrentPageIndex] = useState(0);
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [activeDialogue, setActiveDialogue] = useState(null); 
          const [formData, setFormData] = useState({ authorName: '', roleId: 1, title: '', content: '', type: '沟通时刻' });

          const [isSubmitting, setIsSubmitting] = useState(false);
          const [authError, setAuthError] = useState('');
          const [isOfflineMode, setIsOfflineMode] = useState(false);

          const LOCAL_STORAGE_KEY = 'class_journal_entries_local';

          const toFriendlyAuthError = (error) => {
            const raw = (error && (error.code || error.message)) ? String(error.code || error.message) : '未知错误';
            if (raw.includes('api-key') || raw.includes('invalid-api-key')) {
              return 'Firebase API Key 无效或受限。已切换为本地离线模式，可继续提交记录。';
            }
            return 'Firebase 登录失败：' + raw + '。已切换为本地离线模式。';
          };

          const saveLocalEntries = useCallback((list) => {
            try {
              localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(list));
            } catch (e) {
              console.error('LocalStorage 保存失败:', e);
            }
          }, []);

          const loadLocalEntries = useCallback(() => {
            try {
              const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
              if (!raw) return [];
              const parsed = JSON.parse(raw);
              return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
              console.error('LocalStorage 读取失败:', e);
              return [];
            }
          }, []);

          const handleFormKeyDown = (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
              e.preventDefault();
              e.currentTarget.requestSubmit();
            }
          };

          // 1. Firebase 登录验证
          useEffect(() => {
            const initAuth = async () => {
              try {
                await signInAnonymously(auth);
                setAuthError('');
                setIsOfflineMode(false);
              } catch (error) {
                console.error("Auth Error:", error);
                const message = toFriendlyAuthError(error);
                setAuthError(message);
                setIsOfflineMode(true);
                setEntries(loadLocalEntries());
                alert("⚠️ " + message);
              }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (u) => {
              setUser(u);
              if (u) {
                setAuthError('');
                setIsOfflineMode(false);
              }
            });
            return () => unsubscribe();
          }, [loadLocalEntries]);

          // 2. Firebase 实时数据拉取
          useEffect(() => {
            if (isOfflineMode || !user) return;
            const entriesRef = collection(db, 'artifacts', appId, 'public', 'data', 'journal_entries');
            
            const unsubscribe = onSnapshot(entriesRef, (snapshot) => {
              const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              data.sort((a, b) => b.createdAt - a.createdAt);
              setEntries(data);
            }, (error) => {
              console.error("Firestore Subscribe Error:", error);
            });
            
            return () => unsubscribe();
          }, [user, isOfflineMode]);

          const FloatingParticles = () => (
            <div className="absolute inset-0 pointer-events-none overflow-hidden z-0">
              {[...Array(15)].map((_, i) => (
                <div key={i} className="absolute bg-yellow-200/20 rounded-full"
                     style={{ width: Math.random() * 4 + 2 + 'px', height: Math.random() * 4 + 2 + 'px', left: Math.random() * 100 + '%', top: Math.random() * 100 + '%',
                     animation: `float-up ${Math.random() * 10 + 5}s linear infinite`, animationDelay: `-${Math.random() * 10}s` }} />
              ))}
            </div>
          );

          // 提交函数
          const handleSubmit = async (e) => {
            e.preventDefault();
            if (isSubmitting) return;

            if (!formData.title || !formData.content) {
                alert("⚠️ 请填写完整的标题和内容！");
                return;
            }

            setIsSubmitting(true);

            try {
              if (isOfflineMode) {
                const localEntry = {
                  ...formData,
                  id: 'local_' + Date.now(),
                  authorUid: 'local_user',
                  createdAt: Date.now(),
                  dateStr: new Date().toLocaleDateString()
                };
                const next = [localEntry, ...entries].sort((a, b) => b.createdAt - a.createdAt);
                setEntries(next);
                saveLocalEntries(next);
                setFormData({ ...formData, title: '', content: '' });
                setIsModalOpen(false);
                alert("💾 已保存到本地离线记录（未上传云端）");
                return;
              }

              let currentUser = user;
              if (!currentUser) {
                  try {
                      const credentials = await signInAnonymously(auth);
                      currentUser = credentials.user;
                  } catch(err) {
                      const message = toFriendlyAuthError(err);
                      setAuthError(message);
                      setIsOfflineMode(true);
                      setEntries(loadLocalEntries());
                      alert("⚠️ " + message + "\n\n请重试一次提交（将走本地保存）。");
                      return;
                  }
              }

              const newEntry = {
                ...formData, 
                authorUid: currentUser.uid,
                createdAt: Date.now(), 
                dateStr: new Date().toLocaleDateString()
              };

              await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'journal_entries'), newEntry);
              setFormData({ ...formData, title: '', content: '' });
              setIsModalOpen(false);
              alert("🎉 记录成功上传至云端数据库！"); 
            } catch (error) {
              console.error("上传错误: ", error);
              alert(`❌ 保存失败！\n\n数据库拒绝了写入请求。\n\n解决办法：请去 Firebase 控制台的【Firestore Database】 -> 【Rules】中，将规则修改为 allow read, write: if true;`);
            } finally {
              setIsSubmitting(false);
            }
          };

          const deleteEntry = async (id) => {
            if(!window.confirm("确定要删除这条记录吗？")) return;

            if (isOfflineMode) {
              const next = entries.filter(item => item.id !== id);
              setEntries(next);
              saveLocalEntries(next);
              alert("🗑️ 本地记录已删除");
              return;
            }

            if (!user) return;
            
            try {
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'journal_entries', id));
              alert("🗑️ 删除成功！");
            } catch (error) {
              console.error("Error deleting document: ", error);
              alert("❌ 删除失败，权限不足或网络问题。");
            }
          };

          const navPage = (dir) => { setActiveDialogue(null); setCurrentPageIndex(prev => prev + dir); };

          const renderContent = () => {
            const page = PAGES[currentPageIndex];
            if (page.id === 'TITLE') {
              return (
                <div className="flex flex-col items-center justify-center h-full text-center space-y-10 relative z-10">
                  <div className="space-y-4">
                    <h2 className="text-xl md:text-2xl text-yellow-400 pixel-font tracking-widest animate-pulse">★ 浙江师范大学经济与管理学院 ★</h2>
                    <h1 className="text-4xl md:text-6xl font-bold text-white pixel-font leading-tight drop-shadow-[4px_4px_0_rgba(255,0,0,0.8)]">“经”心领航 <br/> 聚力同行</h1>
                    <div className="rpg-border inline-block p-2 mt-4 bg-blue-900 text-yellow-300 pixel-font animate-bounce">领导力动态手账系统 (云端同步版)</div>
                  </div>
                  <div className="flex justify-center gap-8 my-8 items-end">
                     <CharacterImage member={TEAM_ROSTER[0]} size={64} direction="right" />
                     <CharacterImage member={TEAM_ROSTER[3]} size={64} direction="left" />
                     <CharacterImage member={TEAM_ROSTER[7]} size={56} />
                  </div>
                  <button onClick={() => navPage(1)} className="animate-pulse flex items-center gap-2 text-2xl text-white hover:text-yellow-400 pixel-font mt-10">
                    <PlayIcon /> PRESS START
                  </button>
                </div>
              );
            }

            if (page.id === 'DIRECTORY') {
              return (
                <div className="h-full flex flex-col items-center justify-center p-8 relative z-10">
                  <div className="rpg-border w-full max-w-2xl p-8 bg-black/80 backdrop-blur-sm">
                    <h2 className="text-3xl text-yellow-400 mb-8 pixel-font text-center border-b-4 border-white pb-4">冒险日志 [目录]</h2>
                    <ul className="space-y-4 text-lg md:text-xl text-white pixel-font">
                      {PAGES.slice(2).map((item, idx) => (
                        <li key={item.id} className="flex items-center gap-4 hover:bg-white hover:text-black p-2 cursor-pointer transition-colors" onClick={() => setCurrentPageIndex(idx+2)}>
                          <BoxIcon /> {item.title} {item.type === 'dynamic' && <span className="text-xs text-yellow-300 border border-yellow-300 px-1 ml-2 animate-pulse">互动记录区</span>}
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              );
            }

            if (page.id === 'ROSTER') {
              return (
                <div className="h-full flex flex-col p-4 md:p-8 overflow-y-auto scrollbar-hide relative z-10 pb-32">
                   <div className="bg-blue-900 rpg-border p-4 mb-6 sticky top-0 z-10 shadow-lg">
                      <h2 className="text-2xl text-yellow-400 pixel-font">{page.title}</h2>
                      <p className="text-white text-sm mt-2 pixel-font">点击队伍成员，查看他们的领导力感悟语录！</p>
                   </div>
                   <div className="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 md:gap-6">
                      {TEAM_ROSTER.map((member) => (
                        <div key={member.id} onClick={() => setActiveDialogue(member)} className="rpg-border bg-black/60 p-2 md:p-3 flex flex-col items-center text-center hover:bg-slate-800 cursor-pointer group transition-colors">
                           <div className="my-2 bg-slate-900/50 p-2 rounded w-full flex justify-center"><CharacterImage member={member} size={56} /></div>
                           <h3 className="text-yellow-300 font-bold pixel-font text-xs md:text-sm mt-1">{member.class}</h3>
                           <p className="text-white text-[10px] md:text-xs pixel-font my-1 opacity-70 border-b border-gray-600 pb-1">{member.name}</p>
                           <p className="text-green-400 text-[10px] md:text-xs pixel-font mt-1">[{member.role}]</p>
                        </div>
                      ))}
                   </div>
                   {activeDialogue && <RPGDialogueBox name={activeDialogue.name} roleClass={activeDialogue.class} text={activeDialogue.quote} onClose={() => setActiveDialogue(null)} />}
                </div>
              );
            }

            if (page.type === 'dynamic') {
              const pageEntries = entries.filter(e => e.type === page.category);
              return (
                <div className="h-full flex flex-col p-4 md:p-8 relative z-10">
                   <div className="flex justify-between items-end mb-6 border-b-4 border-white pb-2 bg-black/50 p-2 rounded">
                      <div>
                        <h2 className="text-2xl md:text-3xl text-yellow-400 pixel-font">{page.title}</h2>
                        <p className="text-gray-300 text-sm pixel-font mt-2 hidden md:block">{page.desc}</p>
                      </div>
                      <button onClick={() => { setFormData(prev => ({ ...prev, type: page.category })); setIsModalOpen(true); }} className="btn-pixel bg-green-600 hover:bg-green-500 text-white px-4 py-2 pixel-font flex items-center gap-2 whitespace-nowrap shadow-[0_0_15px_rgba(34,197,94,0.5)]">
                        <PenToolIcon /> <span className="hidden md:inline">书写冒险日志</span><span className="md:hidden">书写</span>
                      </button>
                   </div>
                   <div className="flex-1 overflow-y-auto scrollbar-hide pb-20 space-y-8">
                      {pageEntries.length === 0 ? (
                        <div className="h-full flex flex-col items-center justify-center opacity-50 space-y-4 mt-20">
                           <MessageSquareIcon className="text-white animate-bounce" />
                           <p className="text-white pixel-font bg-black p-2 rpg-border">尚未有冒险者留下足迹，抢先记录第一条进度吧！</p>
                        </div>
                      ) : (
                        pageEntries.map(entry => {
                          const authorRole = TEAM_ROSTER.find(r => r.id === parseInt(entry.roleId)) || TEAM_ROSTER[0];
                          return (
                            <div key={entry.id} className="flex items-start gap-2 md:gap-4 group relative">
                               <div className="flex flex-col items-center w-20 shrink-0">
                                  <div className="rpg-border bg-slate-900 p-2 mb-2 flex items-center justify-center"><CharacterImage member={authorRole} size={50} /></div>
                                  <span className="text-white text-xs pixel-font bg-black px-1 border border-gray-600 truncate max-w-full text-center">{entry.authorName || '匿名'}</span>
                               </div>
                               <div className="flex-1 rpg-border bg-[#111] p-4 relative">
                                  <div className="absolute top-6 -left-[14px] w-0 h-0 border-[6px] border-transparent border-r-white border-y-transparent"></div>
                                  <div className="absolute top-[22px] -left-[9px] w-0 h-0 border-[4px] border-transparent border-r-[#111] border-y-transparent z-10"></div>
                                  <button onClick={() => deleteEntry(entry.id)} className="absolute top-2 right-2 text-gray-600 hover:text-red-500 md:opacity-0 group-hover:opacity-100 transition-opacity p-1">
                                    <Trash2Icon />
                                  </button>
                                  <h3 className="text-lg text-yellow-300 font-bold pixel-font mb-2">{entry.title}</h3>
                                  <div className="text-white pixel-font leading-relaxed whitespace-pre-wrap text-sm md:text-base border-t border-gray-800 pt-2">{entry.content}</div>
                                  <div className="text-right mt-2"><span className="text-gray-500 text-[10px] pixel-font">记录于 {entry.dateStr}</span></div>
                               </div>
                            </div>
                          );
                        })
                      )}
                   </div>
                </div>
              );
            }

            if (page.id === 'APPENDIX') {
              return (
                <div className="h-full flex flex-col p-8 relative z-10">
                   <h2 className="text-3xl text-red-500 pixel-font mb-8 bg-black/80 inline-block p-2 rpg-border">附录：通关须知 (系统结算)</h2>
                   <div className="rpg-border p-6 bg-slate-900/90 backdrop-blur flex flex-col h-full max-w-3xl mx-auto w-full">
                      <h3 className="text-blue-400 text-xl mb-4 border-b border-gray-600 pb-2">🎯 领导力成长结算面板</h3>
                      <div className="space-y-4 text-sm leading-relaxed flex-1 pixel-font text-white">
                         <p className="flex items-center gap-2"><SparklesIcon className="text-yellow-400"/> <strong className="text-yellow-300">本赛季存档数：</strong>系统共记录了 {entries.length} 条轨迹。</p>
                         <p className="flex items-center gap-2"><SparklesIcon className="text-yellow-400"/> <strong className="text-yellow-300">班级凝聚力提升：</strong>已打破社交壁垒，公会荣誉感 MAX。</p>
                         <p className="flex items-center gap-2"><SparklesIcon className="text-yellow-400"/> <strong className="text-yellow-300">泛领导力觉醒：</strong>不论是前排MT还是后排辅助，每个人都在闪闪发光。</p>
                      </div>
                      <div className="flex justify-center gap-6 my-8 items-end">
                        <CharacterImage member={TEAM_ROSTER[3]} size={48} />
                        <CharacterImage member={TEAM_ROSTER[2]} size={48} />
                        <CharacterImage member={TEAM_ROSTER[4]} size={48} />
                        <CharacterImage member={TEAM_ROSTER[6]} size={48} />
                        <CharacterImage member={TEAM_ROSTER[1]} size={48} />
                      </div>
                      <div className="mt-auto border-t border-gray-700 pt-6">
                         <div className="mb-2 flex justify-between text-xs text-gray-400 pixel-font"><span>学期通关进度...</span><span className="text-green-400">100%</span></div>
                         <div className="w-full h-4 border-2 border-white p-0.5 mb-4 bg-black"><div className="bg-green-500 h-full w-full"></div></div>
                         <p className="text-center text-cyan-300 animate-pulse mt-4 text-2xl pixel-font font-bold drop-shadow-[0_0_10px_rgba(34,211,238,0.8)]">[ GAME CLEAR! ]</p>
                      </div>
                   </div>
                </div>
              );
            }
          };

          return (
            <div className="w-full h-screen bg-neutral-900 flex items-center justify-center p-2 md:p-8 font-sans overflow-hidden bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHBhdGggZD0iTTAgMGg0MHY0MEgwVjB6bTIwIDIwaDIwdjIwSDIwVjIweiIgZmlsbD0iIzFhMWExYSIgZmlsbC1vcGFjaXR5PSIwLjQiIGZpbGwtcnVsZT0iZXZlbm9kZCIvPjwvc3ZnPg==')]">
              <div className="w-full max-w-5xl h-full max-h-[850px] bg-gray-800 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.8)] border-8 border-gray-700 relative flex flex-col overflow-hidden">
                <div className="h-8 bg-gray-900 flex justify-between items-center px-4 shrink-0 border-b-2 border-black">
                   <div className="flex gap-2">
                     <div className="w-3 h-3 rounded-full bg-red-500 animate-pulse shadow-[0_0_8px_rgba(239,68,68,0.8)]"></div>
                     <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                   </div>
                   <div className="text-gray-400 text-xs pixel-font font-bold tracking-widest">FF-LEADERSHIP RPG SYSTEM (CLOUD SYNC VER)</div>
                </div>

                <div className="flex-1 bg-[#0a0a0a] relative crt overflow-hidden flex flex-col">
                  <div className="scanline"></div>
                  <FloatingParticles />
                  <div className="flex-1 overflow-hidden z-10 relative">{renderContent()}</div>

                  {currentPageIndex > 0 && (
                    <div className="h-16 bg-[#111] border-t-4 border-white flex justify-between items-center px-4 md:px-6 z-20 shrink-0 rpg-border relative">
                       <button onClick={() => navPage(-1)} className="btn-pixel bg-gray-700 text-white px-3 md:px-4 py-2 text-xs md:text-sm pixel-font hover:bg-gray-600 active:bg-gray-800">◄ 上一页</button>
                       <span className="text-yellow-400 pixel-font text-xs md:text-sm font-bold tracking-widest">PAGE {currentPageIndex} / {PAGES.length - 1}</span>
                       <button onClick={() => navPage(1)} disabled={currentPageIndex === PAGES.length - 1} className="btn-pixel bg-gray-700 text-white px-3 md:px-4 py-2 text-xs md:text-sm pixel-font disabled:opacity-30 hover:bg-gray-600 active:bg-gray-800">下一页 ►</button>
                    </div>
                  )}
                </div>
              </div>

              {isModalOpen && (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                  <div className="w-full max-w-2xl bg-[#111] rpg-border p-6 shadow-[0_0_50px_rgba(0,0,0,1)] animate-in zoom-in-95 h-[90vh] overflow-y-auto scrollbar-hide">
                    <div className="flex justify-between items-center mb-6 border-b-2 border-gray-600 pb-2 sticky top-0 bg-[#111] z-10">
                      <h2 className="text-xl md:text-2xl text-yellow-400 pixel-font flex items-center gap-2">
                        <PenToolIcon size={20} /> 添加新的冒险记录
                      </h2>
                      <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-white btn-pixel p-1 bg-gray-800"><XIcon /></button>
                    </div>

                    <form onSubmit={handleSubmit} onKeyDown={handleFormKeyDown} className="space-y-5 pb-4">
                      <div className="space-y-2">
                        {authError && (
                          <div className="text-yellow-300 text-xs pixel-font border border-yellow-400 bg-yellow-900/20 p-2">
                            ⚠️ {authError}
                          </div>
                        )}
                        <div className="text-gray-400 text-xs pixel-font">
                          提示：在输入框中按 Enter 是换行；按 Ctrl+Enter 可快速提交。
                        </div>
                      </div>
                      
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="flex flex-col space-y-1">
                          <label className="text-green-400 text-sm pixel-font">【选择地图类型】</label>
                          <select value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})} className="bg-black text-white p-3 border-2 border-gray-600 focus:border-white outline-none pixel-font transition-colors">
                            {PAGES.filter(p => p.type === 'dynamic').map(p => <option key={p.category} value={p.category}>{p.category}</option>)}
                          </select>
                        </div>
                        <div className="flex flex-col space-y-1">
                          <label className="text-green-400 text-sm pixel-font">【记录者姓名】</label>
                          <input type="text" required maxLength={10} placeholder="输入你的名字..." value={formData.authorName} onChange={e => setFormData({...formData, authorName: e.target.value})} className="bg-black text-white p-3 border-2 border-gray-600 focus:border-white outline-none pixel-font transition-colors" />
                        </div>
                      </div>

                      <div className="flex flex-col space-y-1">
                        <label className="text-green-400 text-sm pixel-font flex justify-between"><span>【选择你的专属像素角色】</span></label>
                        <div className="flex gap-3 overflow-x-auto pb-4 pt-4 scrollbar-hide px-1 bg-slate-900/50 rpg-border">
                          {TEAM_ROSTER.map(role => {
                            const isSelected = formData.roleId === role.id;
                            return (
                              <div key={role.id} onClick={() => setFormData({...formData, roleId: role.id})} className={`shrink-0 cursor-pointer p-2 flex flex-col items-center border-2 transition-all min-w-[80px] ${isSelected ? 'border-yellow-400 bg-blue-900/80 shadow-[0_0_15px_rgba(250,204,21,0.6)] scale-110 -translate-y-2' : 'border-gray-700 bg-black hover:border-gray-400 hover:-translate-y-1'}`} title={role.class}>
                                 <CharacterImage member={role} size={48} isIdle={isSelected} />
                                 <span className={`text-[10px] mt-3 pixel-font ${isSelected ? 'text-yellow-300 font-bold' : 'text-gray-400'}`}>{role.class}</span>
                              </div>
                            )
                          })}
                        </div>
                      </div>

                      <div className="flex flex-col space-y-1">
                        <label className="text-green-400 text-sm pixel-font">【记录标题】</label>
                        <input type="text" required placeholder="这段经历叫什么？" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="bg-black text-yellow-300 p-3 border-2 border-gray-600 focus:border-white outline-none pixel-font transition-colors font-bold" />
                      </div>

                      <div className="flex flex-col space-y-1">
                        <label className="text-green-400 text-sm pixel-font">【详细经历与感悟】</label>
                        <textarea rows="5" required placeholder="写下你的故事..." value={formData.content} onChange={e => setFormData({...formData, content: e.target.value})} className="bg-black text-white p-3 border-2 border-gray-600 focus:border-white outline-none pixel-font resize-none transition-colors leading-relaxed" />
                      </div>

                      <div className="pt-2 flex justify-end sticky bottom-0 bg-[#111] pb-4 border-t border-gray-800">
                        <button disabled={isSubmitting} type="submit" className="btn-pixel bg-green-700 hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed text-white px-8 py-3 pixel-font text-lg shadow-[0_0_15px_rgba(21,128,61,0.6)] active:translate-y-1">
                          {isSubmitting ? '提交中...' : (isOfflineMode ? '保存到本地 [ Ctrl+Enter ]' : '上传至云端库 [ Ctrl+Enter ]')}
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
